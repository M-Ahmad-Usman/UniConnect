name: CI / Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel any in-progress run for the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # e.g. yourusername/uniconnect

jobs:
  # Job 1: Integration tests
  # Runs Jest tests in server/ against a PostgreSQL 18 service container.
  # A failing integration suite blocks the Docker build and deploy.
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: uniconnect
          POSTGRES_PASSWORD: uniconnect
          POSTGRES_DB: uniconnect_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U uniconnect -d uniconnect_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: |
          echo "DATABASE_URL=postgresql://dummy_user:dummy_pass@localhost:5432/dummy_db" > .env
          npx prisma generate

      - name: Run database migrations (test DB)
        working-directory: server
        env:
          DATABASE_URL: postgresql://uniconnect:uniconnect@localhost:5433/uniconnect_test
        run: npx prisma migrate deploy

      - name: Run integration tests
        working-directory: server
        env:
          # Override only what differs from .env.test — the DB port matches
          # the service container mapping above (host port 5433 → container 5432)
          NODE_ENV: test
          PORT: "4001"
          DATABASE_URL: postgresql://uniconnect:uniconnect@localhost:5433/uniconnect_test
          JWT_ACCESS_SECRET: test-access-secret-at-least-32-characters-long
          JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-characters-long
          JWT_ACCESS_EXPIRY: 15m
          JWT_REFRESH_EXPIRY: 7d
          RESET_PASSWORD_SECRET: test-reset-secret-at-least-32-characters-long
          RESET_PASSWORD_EXPIRY: 1h
          RESEND_API_KEY: re_test_placeholder
          RESEND_FROM_EMAIL: test@resend.dev
          CLOUDINARY_CLOUD_NAME: test_cloud
          CLOUDINARY_API_KEY: test_key
          CLOUDINARY_API_SECRET: test_secret
          CORS_ORIGIN: http://localhost:5173
          CSRF_ENABLED: "false"
          CSRF_SECRET: test-csrf-secret-at-least-32-characters-long
          CSRF_TRUSTED_ORIGINS: http://localhost:5173
          AUTH_COOKIE_SAME_SITE: strict
          AUTH_COOKIE_SECURE: "false"
        # Run Jest directly with --experimental-vm-modules (same as npm test)
        # but without dotenv-cli since env vars are already set above
        run: >
          NODE_OPTIONS='--max-old-space-size=2048'
          node --experimental-vm-modules node_modules/.bin/jest --runInBand --forceExit


  # Job 2: E2E tests (Using Microsoft's Official Container)
  # This job runs in parallel with docker-build
  # but does NOT block deploy — it is informational on main branch.
  # Run it on pull requests to catch regressions before merge.
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.49.1-noble

    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: uniconnect
          POSTGRES_PASSWORD: uniconnect
          POSTGRES_DB: uniconnect_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U uniconnect -d uniconnect_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # Playwright browser downloads are skipped here because they are native to the image!

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: |
          echo "DATABASE_URL=postgresql://dummy_user:dummy_pass@localhost:5432/dummy_db" > .env
          npx prisma generate

      - name: Run database migrations (e2e DB)
        working-directory: server
        env:
          DATABASE_URL: postgresql://uniconnect:uniconnect@localhost:5433/uniconnect_test
        run: npx prisma migrate deploy

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Run E2E tests
        working-directory: client
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://uniconnect:uniconnect@localhost:5433/uniconnect_test
          JWT_ACCESS_SECRET: test-access-secret-at-least-32-characters-long
          JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-characters-long
          JWT_ACCESS_EXPIRY: 15m
          JWT_REFRESH_EXPIRY: 7d
          RESET_PASSWORD_SECRET: test-reset-secret-at-least-32-characters-long
          RESET_PASSWORD_EXPIRY: 1h
          RESEND_API_KEY: re_test_placeholder
          RESEND_FROM_EMAIL: test@resend.dev
          CLOUDINARY_CLOUD_NAME: test_cloud
          CLOUDINARY_API_KEY: test_key
          CLOUDINARY_API_SECRET: test_secret
          CORS_ORIGIN: http://127.0.0.1:5173
          CSRF_ENABLED: "true"
          CSRF_SECRET: test-csrf-secret-at-least-32-characters-long
          CSRF_TRUSTED_ORIGINS: http://127.0.0.1:5173
          E2E_FRONTEND_HOST: "127.0.0.1"
          E2E_FRONTEND_PORT: "5173"
          E2E_BACKEND_HOST: "127.0.0.1"
          E2E_BACKEND_PORT: "4100"
          AUTH_COOKIE_SAME_SITE: strict
          AUTH_COOKIE_SECURE: "false"
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 14


  # Job 3: Build Docker image and push to ghcr.io
  # Runs only after integration tests pass.
  # E2E does NOT gate this job — it runs in parallel.
  docker-build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [integration-tests]

    permissions:
      contents: read
      packages: write   # Required to push to ghcr.io

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers in the GitHub Actions cache to speed up rebuilds
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # Job 4: Deploy to Azure App Service
  # Runs only after the Docker image has been built and pushed.
  # Runs database migrations then updates the App Service container image.
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [docker-build-push]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies (for prisma migrate deploy)
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: |
          echo "DATABASE_URL=postgresql://dummy_user:dummy_pass@localhost:5432/dummy_db" > .env
          npx prisma generate

      - name: Run production database migrations
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          NODE_ENV: production
          # Remaining vars are placeholders — only DATABASE_URL matters for migrate
          JWT_ACCESS_SECRET: migration-placeholder-access-secret-at-least-32-chars
          JWT_REFRESH_SECRET: migration-placeholder-refresh-secret-at-least-32-chars
          RESET_PASSWORD_SECRET: migration-placeholder-reset-secret-at-least-32-chars
          RESEND_API_KEY: migration-placeholder
          RESEND_FROM_EMAIL: noreply@example.com
          CLOUDINARY_CLOUD_NAME: migration-placeholder
          CLOUDINARY_API_KEY: migration-placeholder
          CLOUDINARY_API_SECRET: migration-placeholder
          CSRF_SECRET: migration-placeholder-csrf-secret-at-least-32-chars
        run: npx prisma migrate deploy

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update App Service container image
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az webapp config container set \
              --name ${{ secrets.AZURE_WEBAPP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Restart App Service to pull new image
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az webapp restart \
              --name ${{ secrets.AZURE_WEBAPP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }}

      - name: Wait for health check to pass
        run: |
          echo "Waiting for app to become healthy..."
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: got HTTP $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "Health check did not pass after 4 minutes"
          exit 1
