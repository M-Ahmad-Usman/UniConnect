services:
  postgres:
    image: postgres:17-alpine
    container_name: uniconnect-development-pg
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: uniconnect
      POSTGRES_PASSWORD: uniconnect
      POSTGRES_DB: uniconnect_dev
    volumes:
      - uniconnect-development-pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniconnect -d uniconnect_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  uniconnect-development-pgdata:
