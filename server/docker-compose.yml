services:
  dev-db:
    image: postgres:18.2-bookworm
    container_name: postgres-dev
    ports:
      - 5433:5432
    env_file:
      - .env
    volumes:
      - postgres-dev-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  migrate:
    image: migrate/migrate
    # Variables must be specified for local user
    user: "${UID}:${GID}"
    volumes:
      - ./src/db/migrations:/migrations
    depends_on:
      - dev-db
    profiles:
      - tools

volumes:
  postgres-dev-data: